name: Verificar sistema
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check planilhas.js && node --check gestao.js && node --check pedagogia.js && node --check resumo.js && node --check conta.js && node --check scripts/provisionar-acessos.cjs && node --check mobile.js && node --check pwa.js && node --check sw.js
      - run: node --test tests/*.test.cjs
